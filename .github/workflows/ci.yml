name: CI
on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      # owner#750 (zero metered GitHub spend): a public repository may use
      # GitHub's free standard hosted runners; larger and GPU hosted runners
      # are banned everywhere.
      - name: No larger or GPU GitHub-hosted runners
        run: |
          if grep -rnE '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github/workflows | grep -v '^[^:]*:[0-9]*:[[:space:]]*#'; then
            echo "::error::larger or GPU GitHub-hosted runners are banned (owner#750)"
            exit 1
          fi
      - name: Validate Renovate JSON
        run: python3 scripts/validate_renovate.py
