name: CI
on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64"]') }}
    steps:
      - uses: actions/checkout@v4
      # owner#750 (zero metered GitHub spend): a public repository may use
      # GitHub's free standard hosted runners; larger and GPU hosted runners
      # are banned everywhere.
      - name: No larger or GPU GitHub-hosted runners
        run: |
          if grep -rnE '(ubuntu|windows|macos)-[a-z0-9.-]*(cores|xlarge|large|gpu)' .github/workflows | grep -v '^[^:]*:[0-9]*:[[:space:]]*#'; then
            echo "::error::larger or GPU GitHub-hosted runners are banned (owner#750)"
            exit 1
          fi
      - name: Validate Renovate JSON
        run: python3 scripts/validate_renovate.py
      - name: Python policy and publication tests
        run: |
          python3 -m pip install --user PyYAML==6.0.3
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Locked native Renovate tests
        run: |
          engine=$(mktemp -d)
          trap 'rm -rf "$engine"' EXIT
          cp runner/package{,-lock}.json "$engine/"
          npm ci --prefix "$engine" --omit=dev --no-audit --no-fund
          SHARED_PIN_ENGINE_DIR="$engine" "$engine/node_modules/node/bin/node" --test tests/native_engine.mjs

  # The required check (docs/ci-template.md and docs/optimistic-merge.md in
  # SylphxAI/.github): one aggregate whose name is `ci-ok`, so a required
  # status check resolves on every pull request and merge group. Skipped lanes
  # pass; a failed lane fails.
  ci-ok:
    if: always()
    needs: [validate]
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","x64"]') }}
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.validate.result }}" = success ]'
